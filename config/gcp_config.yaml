# GCP Lakehouse & Deployment Configuration

gcp:
  project_id: "your-gcp-project-id"          # Set via env GCP_PROJECT_ID
  region: "us-central1"
  gcs_bucket: "baseball-fatigue-lakehouse"    # Set via env GCS_BUCKET_NAME
  bigquery_dataset: "baseball_analytics"     # Set via env BIGQUERY_DATASET

storage:
  backend: "duckdb"                          # "duckdb" for local, "bigquery" for GCP
  local_db_path: "data/baseball_warehouse.duckdb"
  parquet_root: "data"

tables:
  bronze_raw: "raw_statcast_pitches"
  silver_dim_pitchers: "dim_pitchers"
  silver_dim_games: "dim_games"
  silver_qualified_pitches: "stg_qualified_pitches"
  silver_baselines: "feat_pitcher_pitchtype_baseline"
  silver_features: "feat_pitch_level_features"
  gold_anomaly_scores: "fact_pitch_anomaly_scores"
  gold_alert_events: "fact_alert_events"
  gold_collapse_labels: "fact_collapse_labels"
  gold_model_evaluation: "mart_model_evaluation"
  gold_case_studies: "mart_game_case_studies"
