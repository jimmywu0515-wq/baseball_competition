# GCP Lakehouse & Deployment Configuration

gcp:
  # Runtime values come from GCP_PROJECT_ID and GCS_BUCKET_NAME. Keeping
  # account identifiers out of source prevents publishing into the wrong project.
  project_id: ""
  region: "us-central1"
  gcs_bucket: ""
  bigquery_dataset: "baseball_analytics"

storage:
  backend: "duckdb"                          # "duckdb" for local, "bigquery" for GCP
  local_db_path: "data/baseball_warehouse.duckdb"
  parquet_root: "data"

tables:
  bronze_raw: "raw_statcast_pitches"
  silver_dim_pitchers: "dim_pitchers"
  silver_dim_games: "dim_games"
  silver_qualified_pitches: "stg_qualified_pitches"
  silver_baselines: "feat_pitcher_pitchtype_baseline"
  silver_features: "feat_pitch_level_features"
  gold_anomaly_scores: "fact_pitch_anomaly_scores"
  gold_alert_events: "fact_alert_events"
  gold_collapse_labels: "fact_collapse_labels"
  gold_model_evaluation: "mart_model_evaluation"
  gold_historical_evaluation: "mart_historical_2024_evaluation"
  gold_threshold_tradeoffs: "mart_threshold_tradeoffs"
  gold_bootstrap_intervals: "mart_bootstrap_confidence_intervals"
  gold_lead_time_sensitivity: "mart_lead_time_sensitivity"
  gold_matched_warning_episodes: "fact_matched_warning_episodes"
  gold_pitcher_model_evaluation: "mart_pitcher_model_evaluation"
  gold_cohort_selection_audit: "audit_cohort_selection"
  gold_ingestion_segment_audit: "audit_ingestion_segments"
  gold_integrity_report: "warehouse_integrity_report"
  gold_case_studies: "mart_game_case_studies"
